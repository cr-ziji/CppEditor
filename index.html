<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CppEditor</title>
    <link rel="stylesheet" href="editor://app/vs/editor/editor.main.css">
    <link rel="stylesheet" href="editor://app/style.css">
  </head>
  <body>
    <div id="fileframe">

    </div>

    <div id="resizer"></div>

    <div id="textframe">
      <div id="tabbar">

      </div>

      <!-- 非文本内容（图片 / 二进制 / 读取失败提示）视图 -->
      <div id="fileview" style="display:none"></div>

      <!-- 占满屏幕的编辑器区域 -->
      <div id="editor"></div>

      <!-- 底部状态栏：LSP 状态 + 错误/警告数量 -->
      <div id="statusbar">
        <div class="item" id="lsp-status">
          <span class="status-dot offline" id="lsp-dot"></span>
          <span id="lsp-status-text">正在连接语言服务器...</span>
        </div>
        <div class="item" id="diag-status">
          <span class="err" id="diag-errors">0 个错误</span>
          <span>·</span>
          <span class="warn" id="diag-warnings">0 个警告</span>
        </div>
        <div class="spacer"></div>
        <div class="item" id="save-status" style="color:#9d9d9d"></div>
        <div class="item" id="file-status">
          <span id="file-path">main.cpp</span>
        </div>
        <div class="item" id="cursor-status">
          <span id="cursor-pos">Ln 1, Col 1</span>
        </div>
      </div>
    </div>

    <!-- monaco AMD loader -->
    <script src="editor://app/vs/loader.js"></script>
    <!-- 应用逻辑 -->
    <script src="editor://app/renderer.js"></script>
  </body>
</html>
