<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CppEditor</title>
    <link
      rel="stylesheet"
      href="editor://app/vs/editor/editor.main.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        background: #1e1e1e;
        color: #cccccc;
      }

      #editor {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 28px;
      }

      /* ------------------------------------------------------------------
       * 底部状态栏
       * ------------------------------------------------------------------ */
      #statusbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 12px;
        box-sizing: border-box;
        background: #252526;
        border-top: 1px solid #3c3c3c;
        font-size: 12px;
        color: #9d9d9d;
        user-select: none;
        white-space: nowrap;
      }

      #statusbar .item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #statusbar .spacer {
        flex: 1;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #808080;
        flex-shrink: 0;
        transition: background-color 0.2s ease;
      }

      .status-dot.connecting {
        background: #d7ba7d;
        animation: pulse 1s ease-in-out infinite;
      }

      .status-dot.connected {
        background: #89d185;
      }

      .status-dot.error,
      .status-dot.offline {
        background: #f48771;
      }

      .status-dot.warning {
        background: #d7ba7d;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      #lsp-status-text {
        max-width: 420px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #diag-status {
        color: #cccccc;
      }

      #diag-status .err {
        color: #f48771;
      }

      #diag-status .warn {
        color: #d7ba7d;
      }

      #cursor-status {
        color: #9d9d9d;
      }

      #file-status {
        color: #9d9d9d;
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <!-- 占满屏幕的编辑器区域 -->
    <div id="editor"></div>

    <!-- 底部状态栏：LSP 状态 + 错误/警告数量 -->
    <div id="statusbar">
      <div class="item" id="lsp-status">
        <span class="status-dot offline" id="lsp-dot"></span>
        <span id="lsp-status-text">正在连接语言服务器...</span>
      </div>
      <div class="item" id="diag-status">
        <span class="err" id="diag-errors">0 个错误</span>
        <span>·</span>
        <span class="warn" id="diag-warnings">0 个警告</span>
      </div>
      <div class="spacer"></div>
      <div class="item" id="save-status" style="color:#9d9d9d"></div>
      <div class="item" id="file-status">
        <span id="file-path">main.cpp</span>
      </div>
      <div class="item" id="cursor-status">
        <span id="cursor-pos">Ln 1, Col 1</span>
      </div>
    </div>

    <!-- monaco AMD loader -->
    <script src="editor://app/vs/loader.js"></script>
    <!-- 应用逻辑 -->
    <script src="editor://app/renderer.js"></script>
  </body>
</html>
