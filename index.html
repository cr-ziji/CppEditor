<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CppEditor</title>
    <script>
      // 首帧前同步应用主题：在 <html> 根上加 class，CSS 一旦应用即按主题着色，避免先闪深色
      (function () {
        var t = new URLSearchParams(location.search).get('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.classList.add(t === 'light' ? 'theme-light' : 'theme-dark');
        }
      })();
    </script>
    <link rel="stylesheet" href="editor://app/vs/editor/editor.main.css">
    <link rel="stylesheet" href="editor://app/style.css">
  </head>
  <body>
    <header>
      <img src="editor://app/icon.svg" alt="CppEditor" id="app-icon">
      <h1 id="app-title">CppEditor</h1>
      <button id="run-btn"><img src="editor://app/resources/header/run.svg" data-dark-src="editor://app/resources/header/run.svg" data-light-src="editor://app/resources/header/light/run.svg" alt="运行"></button>
      <button id="setting-btn"><img src="editor://app/resources/header/setting.svg" data-dark-src="editor://app/resources/header/setting.svg" data-light-src="editor://app/resources/header/light/setting.svg" alt="设置"></button>
      <button id="minimize-btn"><img src="editor://app/resources/header/minimize.svg" data-dark-src="editor://app/resources/header/minimize.svg" data-light-src="editor://app/resources/header/light/minimize.svg" alt="最小化"></button>
      <button id="maximize-btn"><img src="editor://app/resources/header/maximize.svg" data-dark-src="editor://app/resources/header/maximize.svg" data-light-src="editor://app/resources/header/light/maximize.svg" alt="最大化"></button>
      <button id="unmaximize-btn" style="display: none"><img src="editor://app/resources/header/unmaximize.svg" data-dark-src="editor://app/resources/header/unmaximize.svg" data-light-src="editor://app/resources/header/light/unmaximize.svg" alt="还原"></button>
      <button id="close-btn"><img src="editor://app/resources/header/close.svg" data-dark-src="editor://app/resources/header/close.svg" data-light-src="editor://app/resources/header/light/close.svg" alt="关闭"></button>
    </header>

    <div id="content">

      <div id="fileframe">
        <div id="filetoolbar"></div>
        <div id="filetree"></div>
      </div>

      <div id="resizer"></div>

      <div id="textframe">
        <div id="tabbar">

        </div>

        <!-- 非文本内容（图片 / 二进制 / 读取失败提示）视图 -->
        <div id="fileview" style="display:none"></div>

        <!-- 占满屏幕的编辑器区域 -->
        <div id="editor"></div>

        <!-- 底部状态栏：LSP 状态 + 错误/警告数量 -->
        <div id="statusbar">
          <div class="item" id="lsp-status">
            <span class="status-dot offline" id="lsp-dot"></span>
            <span id="lsp-status-text">正在连接语言服务器...</span>
          </div>
          <div class="item" id="diag-status">
            <span class="err" id="diag-errors">0 个错误</span>
            <span>·</span>
            <span class="warn" id="diag-warnings">0 个警告</span>
          </div>
          <div class="spacer"></div>
          <div class="item" id="save-status" style="color:#9d9d9d"></div>
          <div class="item" id="file-status">
            <span id="file-path"></span>
          </div>
          <div class="item" id="cursor-status">
            <span id="cursor-pos">Ln 1, Col 1</span>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部编译输出面板：展示 g++ 编译产生的警告 / 错误 -->
    <div id="build-output" style="display:none">
      <div class="build-head">
        <span class="build-title">编译输出</span>
        <button id="build-close" title="关闭">×</button>
      </div>
      <div class="build-body"></div>
    </div>

    <!-- monaco AMD loader -->
    <script src="editor://app/vs/loader.js"></script>
    <!-- 应用逻辑 -->
    <script src="editor://app/renderer.js"></script>
  </body>
</html>
