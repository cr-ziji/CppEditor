<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CppEditor</title>
    <script>
      // 首帧前同步应用主题：在 <html> 根上加 class，CSS 一旦应用即按主题着色，避免先闪深色
      (function () {
        var t = new URLSearchParams(location.search).get('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.classList.add(t === 'light' ? 'theme-light' : 'theme-dark');
        }
      })();
    </script>
    <link rel="stylesheet" href="vs/editor/editor.main.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <img src="icon.svg" alt="CppEditor" id="app-icon">
      <h1 id="app-title">CppEditor</h1>
      <button id="files-btn" title="文件列表"><img src="resources/header/files.svg" data-dark-src="resources/header/files.svg" data-light-src="resources/header/light/files.svg" alt="文件"></button>
      <button id="newfile-btn" title="新建文件 (Ctrl+N)"><img src="resources/header/newfile.svg" data-dark-src="resources/header/newfile.svg" data-light-src="resources/header/light/newfile.svg" alt="新建"></button>
      <button id="undo-btn" title="撤销 (Ctrl+Z)"><img src="resources/header/undo.svg" data-dark-src="resources/header/undo.svg" data-light-src="resources/header/light/undo.svg" alt="撤销"></button>
      <button id="redo-btn" title="重做 (Ctrl+Y)"><img src="resources/header/redo.svg" data-dark-src="resources/header/redo.svg" data-light-src="resources/header/light/redo.svg" alt="重做"></button>
      <button id="save-btn" title="保存 (Ctrl+S)"><img src="resources/header/save.svg" data-dark-src="resources/header/save.svg" data-light-src="resources/header/light/save.svg" alt="保存"></button>
      <button id="run-btn"><img src="resources/header/run.svg" data-dark-src="resources/header/run.svg" data-light-src="resources/header/light/run.svg" alt="运行"><svg class="run-spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path class="spinner-arc" d="M12 2 a10 10 0 0 1 10 10" fill="none" stroke="currentColor"/></svg></button>
      <button id="find-btn" title="查找 / 替换 (Ctrl+F / Ctrl+R)"><img src="resources/header/find.svg" data-dark-src="resources/header/find.svg" data-light-src="resources/header/light/find.svg" alt="查找"></button>
      <button id="setting-btn"><img src="resources/header/setting.svg" data-dark-src="resources/header/setting.svg" data-light-src="resources/header/light/setting.svg" alt="设置"></button>
      <button id="minimize-btn"><img src="resources/header/minimize.svg" data-dark-src="resources/header/minimize.svg" data-light-src="resources/header/light/minimize.svg" alt="最小化"></button>
      <button id="maximize-btn"><img src="resources/header/maximize.svg" data-dark-src="resources/header/maximize.svg" data-light-src="resources/header/light/maximize.svg" alt="最大化"></button>
      <button id="unmaximize-btn" style="display: none"><img src="resources/header/unmaximize.svg" data-dark-src="resources/header/unmaximize.svg" data-light-src="resources/header/light/unmaximize.svg" alt="还原"></button>
      <button id="close-btn"><img src="resources/header/close.svg" data-dark-src="resources/header/close.svg" data-light-src="resources/header/light/close.svg" alt="关闭"></button>
    </header>

    <div id="content">

      <div id="fileframe">
        <div id="filetoolbar"></div>
        <div id="filetree"></div>
      </div>

      <div id="resizer"></div>

      <div id="textframe">
        <div id="tabbar">

        </div>

        <!-- 非文本内容（图片 / 二进制 / 读取失败提示）视图 -->
        <div id="fileview" style="display:none"></div>

        <!-- 占满屏幕的编辑器区域 -->
        <div id="editor"></div>

        <!-- 文本查找 / 替换栏 -->
        <div id="findbar" style="display:none">
          <div class="find-row">
            <input id="find-input" type="text" spellcheck="false" placeholder="查找" />
            <span id="find-count"></span>
            <button id="find-prev" class="find-btn" title="上一个 (Shift+Enter)">&#8593;</button>
            <button id="find-next" class="find-btn" title="下一个 (Enter)">&#8595;</button>
            <button id="find-close" class="find-btn" title="关闭 (Esc)">&#10005;</button>
          </div>
          <div class="find-row" id="replace-row" style="display:none">
            <input id="replace-input" type="text" spellcheck="false" placeholder="替换为" />
            <button id="replace-one" class="find-btn" title="替换当前">替换</button>
            <button id="replace-all" class="find-btn" title="全部替换">全部替换</button>
          </div>
          <div class="find-options">
            <label><input type="checkbox" id="find-case" />区分大小写</label>
            <label><input type="checkbox" id="find-word" />全词匹配</label>
            <label><input type="checkbox" id="find-regex" />正则</label>
          </div>
        </div>

        <!-- 底部状态栏：LSP 状态 + 错误/警告数量 -->
        <div id="statusbar">
          <div class="item" id="lsp-status">
            <span class="status-dot offline" id="lsp-dot"></span>
            <span id="lsp-status-text">正在连接语言服务器...</span>
          </div>
          <div class="item" id="diag-status">
            <span class="err" id="diag-errors">0 个错误</span>
            <span>·</span>
            <span class="warn" id="diag-warnings">0 个警告</span>
          </div>
          <div class="spacer"></div>
          <div class="item" id="save-status" style="color:#9d9d9d"></div>
          <div class="item" id="file-status">
            <span id="file-path"></span>
          </div>
          <div class="item" id="cursor-status">
            <span id="cursor-pos">Ln 1, Col 1</span>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部编译输出面板：展示 g++ 编译产生的警告 / 错误 -->
    <div id="build-output" style="display:none">
      <div class="build-head">
        <span class="build-title">编译输出</span>
        <button id="build-close" title="关闭">×</button>
      </div>
      <div class="build-body"></div>
    </div>

    <!-- 交互式终端面板：全屏覆盖，仿 Termux -->
    <div id="terminal" style="display:none">
      <div class="term-head">
        <span class="term-title">终端</span>
        <span class="term-time"></span>
        <button id="term-close" title="关闭终端">×</button>
      </div>
      <div class="term-body">
        <pre class="term-content"></pre>
      </div>
      <textarea class="term-kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    </div>

    <!-- 光标行诊断提示条：显示当前行的 clangd 错误/警告详情 -->
    <div id="diag-hover" style="display:none" onclick="this.style.display='none'">
      <span id="diag-hover-icon"></span>
      <span id="diag-hover-text"></span>
    </div>

    <!-- 文件树右键菜单（内容由渲染进程动态构建） -->
    <div id="tree-menu" style="display:none"></div>

    <!-- 编辑器右键菜单（复制 / 粘贴 / 剪切 / 全选 / 查找 / 替换 / 运行 / 到定义 / 到引用） -->
    <div id="editor-menu" style="display:none"></div>

    <!-- 编辑器「到引用」结果列表面板 -->
    <div id="references-panel" style="display:none">
      <div class="ref-head">
        <span id="ref-title">引用</span>
        <button id="ref-close" class="ref-close" title="关闭 (Esc)">×</button>
      </div>
      <div id="ref-list" class="ref-list"></div>
    </div>

    <!-- 文件树新建 / 重命名输入弹层 -->
    <div id="tree-input" style="display:none">
      <div class="tree-input-box">
        <div id="tree-input-title"></div>
        <input id="tree-input-field" type="text" spellcheck="false" />
        <div class="tree-input-btns">
          <button id="tree-input-ok" type="button">确定</button>
          <button id="tree-input-cancel" type="button">取消</button>
        </div>
      </div>
    </div>

    <!-- 自定义 confirm 弹层（替代 window.confirm，Android WebView 无 WebChromeClient 时不工作） -->
    <div id="confirm-dialog" style="display:none">
      <div class="confirm-box">
        <div id="confirm-message"></div>
        <div class="confirm-btns">
          <button id="confirm-ok" type="button">确定</button>
          <button id="confirm-cancel" type="button">取消</button>
        </div>
      </div>
    </div>

    <!-- 窄屏文件树抽屉的半透明遮罩（默认隐藏，点击关闭抽屉） -->
    <div id="tree-backdrop" style="display:none"></div>

    <!-- monaco AMD loader -->
    <script src="vs/loader.js"></script>
    <!-- 平台适配层（Electron 下自动跳过；Android 下用原生桥实现 editorAPI） -->
    <script src="platform.js"></script>
    <!-- 应用逻辑 -->
    <script src="renderer.js"></script>
  </body>
</html>
